  <rect width="800" height="450" fill="#3a2408"/>
  <defs>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="55%" stop-color="#ffc23c"/>
      <stop offset="100%" stop-color="#ff8a1f"/>
    </radialGradient>
  </defs>
  <circle cx="600" cy="180" r="70" fill="url(#sun)"/>
  <ellipse cx="600" cy="180" rx="170" ry="62" fill="none" stroke="#ffe9b0" stroke-width="8" transform="rotate(-14 600 180)"/>
  <ellipse cx="600" cy="180" rx="170" ry="62" fill="none" stroke="#111" stroke-opacity="0.25" stroke-width="8" stroke-dasharray="2 22" transform="rotate(-14 600 180)"/>
  <text x="56" y="120" fill="#fff3d9" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="900" letter-spacing="-2">DYSON</text>
  <text x="56" y="176" fill="#fff3d9" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="900" letter-spacing="-2">RING</text>
  <text x="58" y="330" fill="#ffd88a" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" letter-spacing="1.5">TÜBİTAK 2209-A ARAŞTIRMA ÖNERİSİ</text>
  <text x="58" y="360" fill="#e0b876" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" letter-spacing="1">Bir yıldızın enerjisini toplayan mega-yapı fizibilitesi</text>
